name: Refresh vessel positions

on:
  schedule:
    # 05:00 UTC every day. Adjust the cron if you want a different time.
    - cron: "0 5 * * *"
  workflow_dispatch: {} # lets you run it manually from the Actions tab

# A second run (manual click while the 05:00 one is going) waits its turn
# instead of racing the first one to push routes.json.
concurrency:
  group: refresh-positions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Pushes the rebuilt public/routes.json — the default token is read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests searoute

      # Exits non-zero (red ✗, and GitHub emails you) if fewer than half the
      # fleet comes back — a dead source must never look like a green run again.
      - name: Fetch AIS positions from Open Waters and update Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Optional. Without it Open Waters is used anonymously (10 MMSIs per
          # request, which is plenty); a free personal token raises that to 50.
          OPENWATERS_TOKEN: ${{ secrets.OPENWATERS_TOKEN }}
        run: python scripts/refresh_positions.py

      # Voyage lines are precomputed, so they must be rebuilt whenever the
      # positions move — otherwise each line ends where the ship used to be.
      # The travelled leg is each ship's real AIS track, also from Open Waters;
      # this step fails (and nothing is committed) if under half come back.
      - name: Rebuild voyage routes from the live fleet
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENWATERS_TOKEN: ${{ secrets.OPENWATERS_TOKEN }}
        run: python scripts/build_routes.py

      - name: Commit routes if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/routes.json; then
            echo "Routes unchanged, skipping commit."
          else
            # routes.json is rebuilt whole from live Supabase, so ours is the
            # freshest copy: never merge it, just lay it on top of whatever
            # main is now. (A `git pull --rebase` here conflicted whenever
            # another run had pushed routes in the meantime, Oct 2026.)
            cp public/routes.json "$RUNNER_TEMP/routes.json"
            for attempt in 1 2 3; do
              git fetch -q origin main
              git reset -q --hard origin/main
              cp "$RUNNER_TEMP/routes.json" public/routes.json
              if git diff --quiet -- public/routes.json; then
                echo "Routes already up to date on main."
                exit 0
              fi
              git add public/routes.json
              git commit -m "Refresh voyage routes"
              # Fails only if the wind workflow pushed in the last few seconds.
              git push origin HEAD:main && exit 0
              sleep 10
            done
            exit 1
          fi
